version: 2
updates:
  # Dependências do npm: uma PR por semana com tudo agrupado
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # Actions do GitHub: uma vez por mês
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
